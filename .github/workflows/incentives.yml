name: Independent liquidity incentives

on:
  push:
    paths: ['liquidity-incentives/**', 'feature-lab/**', '.github/workflows/incentives.yml']
  pull_request:
    paths: ['liquidity-incentives/**', 'feature-lab/**', '.github/workflows/incentives.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: liquidity-incentives
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saffron_incentives_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saffron_incentives_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SAFFRON_TEST_DB_HOST: 127.0.0.1
      SAFFRON_TEST_DB_USER: saffron_incentives_test
      SAFFRON_TEST_DB_PASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: liquidity-incentives/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:database
      - run: npm run test:lifecycle
      - run: npm run test:watcher
      - run: npm run test:restore
        env:
          SAFFRON_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run test:browser
      - run: npm run test:vnc
      - run: npm run demo -- --smoke
      - run: npm run build:lab
      - run: npm run test:browser -- --grep 'approved cards'
        env:
          SAFFRON_TEST_LAB: '1'
      - run: npm ci
        working-directory: feature-lab/live-apr-merge
      - run: npx playwright install --with-deps chromium
        working-directory: feature-lab/live-apr-merge
      - run: npm run check:upstream && npm run test:source && npm run test:release && npm test
        working-directory: feature-lab/live-apr-merge
      - run: npm run build:lab && npm run test:browser
        working-directory: feature-lab/live-apr-merge
        env:
          VITE_BASE_PATH: /
          MERGE_BASE: /
          SAFFRON_BACKEND_SOURCE: ${{ github.workspace }}/liquidity-incentives
          VITE_WALLETCONNECT_PROJECT_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - run: npm run test:configuration && npm run test:status
        working-directory: feature-lab/live-apr-merge
      - run: npm run build:live
        working-directory: feature-lab/live-apr-merge
        env:
          VITE_BASE_PATH: /
          VITE_UI_TWEAKS: 'true'
      - run: npm run build:live
        working-directory: feature-lab/live-apr-merge
        env:
          VITE_BASE_PATH: /
          VITE_UI_TWEAKS: 'false'
      - run: npm run test:backend-browser
        working-directory: feature-lab/live-apr-merge
        env:
          SAFFRON_BACKEND_SOURCE: ${{ github.workspace }}/liquidity-incentives
          MERGE_DEVICE: mobile
      - run: npm run test:backend-browser
        working-directory: feature-lab/live-apr-merge
        env:
          SAFFRON_BACKEND_SOURCE: ${{ github.workspace }}/liquidity-incentives
          MERGE_DEVICE: desktop
      - run: npm run test:walletconnect
        working-directory: feature-lab/live-apr-merge
        env:
          SAFFRON_BACKEND_SOURCE: ${{ github.workspace }}/liquidity-incentives
          MERGE_DEVICE: mobile
      - run: npm run test:release-browser
        working-directory: feature-lab/live-apr-merge
        env:
          SAFFRON_BACKEND_SOURCE: ${{ github.workspace }}/liquidity-incentives
      - run: npm run test:apr-http
        working-directory: feature-lab/live-apr-merge
      - run: npm run build:live
        working-directory: feature-lab/live-apr-merge
        env:
          VITE_BASE_PATH: /nested/incentives/
          MERGE_BUILD_DIR: validation/nested
      - run: npm run test:release-browser
        working-directory: feature-lab/live-apr-merge
        env:
          SAFFRON_BACKEND_SOURCE: ${{ github.workspace }}/liquidity-incentives
          MERGE_WEBROOT: validation/nested
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incentives-public-acceptance
          path: |
            liquidity-incentives/validation/complete-cycle.json
            feature-lab/live-apr-merge/validation/browser/*.json
            feature-lab/live-apr-merge/validation/browser/*.png
            feature-lab/live-apr-merge/validation/configuration/*.json
            feature-lab/live-apr-merge/validation/configuration/*.png
            feature-lab/live-apr-merge/validation/status/*.json
            feature-lab/live-apr-merge/validation/status/*.png
            feature-lab/live-apr-merge/validation/backend-browser-*/*.json
            feature-lab/live-apr-merge/validation/backend-browser-*/*.png
            feature-lab/live-apr-merge/validation/apr-http/*.json
            feature-lab/live-apr-merge/validation/release/*.json
  frontend-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: feature-lab/live-apr-merge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: feature-lab/live-apr-merge/package-lock.json
      - run: npm ci
      - run: npm run check:upstream
      - run: npm run test:source
      - run: npm run test:release
      - run: npm test
      - run: npm run build
      - run: npm run build:live
      - run: python scripts/package_source.py validation/live-apr-merge-source.zip
      - run: python scripts/verify_source.py validation/live-apr-merge-source.zip --extract validation/extracted
      - run: npm ci
        working-directory: feature-lab/live-apr-merge/validation/extracted/live-apr-merge
      - run: python scripts/verify_source.py
        working-directory: feature-lab/live-apr-merge/validation/extracted/live-apr-merge
      - run: npm run check:upstream && npm run test:source && npm run test:release && npm test
        working-directory: feature-lab/live-apr-merge/validation/extracted/live-apr-merge
      - run: npm run build && npm run build:lab && npm run build:live
        working-directory: feature-lab/live-apr-merge/validation/extracted/live-apr-merge
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: liquidity-incentives
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: liquidity-incentives/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --input-type=module -e "import { anvilBinary } from './tests/anvil.mjs'; import { execFileSync } from 'node:child_process'; execFileSync(anvilBinary(), ['--version'], {stdio:'inherit'});"
      - run: node --test tests/protected-worker.test.mjs
      - run: npm run build:lab
