name: Deploy Saffron Scaffold GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:mock

      - name: Preserve the existing preview URL
        run: |
          preview_copy="${RUNNER_TEMP}/yield-side-selector-preview"
          mkdir -p "${preview_copy}"
          cp -a dist/. "${preview_copy}/"
          mkdir -p dist/previews/yield-side-selector-preview
          cp -a "${preview_copy}/." dist/previews/yield-side-selector-preview/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
