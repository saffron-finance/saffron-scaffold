name: Deploy yield-selector branch preview

on:
  push:
    branches: [yield-side-selector-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      # A dedicated environment keeps the protected main Pages environment
      # unchanged while still giving this branch an auditable deployment.
      name: github-pages-preview-yield-side-selector
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Rebuild main at the canonical root so this branch deployment cannot
      # substitute preview code for the public main-branch site.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - uses: actions/checkout@v4
        with:
          path: preview-site

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            main-site/package-lock.json
            preview-site/package-lock.json

      - run: npm ci
        working-directory: main-site
      - run: npm run build:mock
        working-directory: main-site

      - run: npm ci
        working-directory: preview-site
      - run: npm run build:mock
        working-directory: preview-site

      - name: Add the isolated branch preview below the main site
        run: |
          mkdir -p main-site/dist/previews/yield-side-selector-preview
          cp -a preview-site/dist/. main-site/dist/previews/yield-side-selector-preview/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main-site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
