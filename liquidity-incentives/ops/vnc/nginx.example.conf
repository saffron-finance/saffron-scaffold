# Separate authenticated QA route; existing app routes and auth are unchanged.
location = /saffron/apps/vault-watcher-test {
    auth_basic "Saffron Page Scaffold";
    auth_basic_user_file /etc/nginx/auth/vault-qa.htpasswd;
    return 302 /saffron/apps/vault-watcher-test/;
}
location ^~ /saffron/apps/vault-watcher-test/desktop/ {
    auth_basic "Saffron Page Scaffold";
    auth_basic_user_file /etc/nginx/auth/vault-qa.htpasswd;
    proxy_pass http://127.0.0.1:8932/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Frame-Options SAMEORIGIN always;
}
location ^~ /saffron/apps/vault-watcher-test/ {
    auth_basic "Saffron Page Scaffold";
    auth_basic_user_file /etc/nginx/auth/vault-qa.htpasswd;
    proxy_pass http://127.0.0.1:8933;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 4k;
    add_header X-Frame-Options SAMEORIGIN always;
}
